<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AICO Membership Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --brand:#0d4a6b;
    --brand-2:#1a7fb5;
    --accent:#f0b400;
    --bg:#f5f7fb;
    --surface:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#e5e7eb;
    --ok:#16a34a;
    --warn:#dc2626;
    --soft:#eef4f9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--brand-2);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;width:100%;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(26,127,181,.15)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}

  header.app-header{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:50}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:54px;width:auto;background:#fff;padding:4px;border-radius:8px}
  .brand .title{font-size:18px;font-weight:700;line-height:1.1}
  .brand .sub{font-size:11px;opacity:.85;letter-spacing:.6px;text-transform:uppercase}
  .header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .user-chip{background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:8px}
  .btn-ghost{background:rgba(255,255,255,.15);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500}
  .btn-ghost:hover{background:rgba(255,255,255,.25)}

  .shell{max-width:1320px;margin:0 auto;padding:28px}
  .page-title{font-size:24px;font-weight:700;margin:0 0 4px}
  .page-sub{color:var(--muted);margin:0 0 22px;font-size:14px}

  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px;margin-bottom:20px;flex-wrap:wrap}
  .tab{flex:1;min-width:120px;padding:10px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);background:transparent;text-align:center}
  .tab.active{background:var(--brand);color:#fff}
  .tab:hover:not(.active){background:var(--soft);color:var(--brand)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.03);margin-bottom:18px}
  .card:last-child{margin-bottom:0}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.4px}
  .grid{display:grid;gap:16px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-5{grid-template-columns:repeat(5,1fr)}
  .grid-6{grid-template-columns:repeat(6,1fr)}
  @media(max-width:1200px){.grid-5,.grid-6{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:700px){.grid-2,.grid-3,.grid-4,.grid-5,.grid-6{grid-template-columns:1fr}}

  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
  .kpi .value{font-size:22px;font-weight:700;margin-top:6px;color:var(--brand)}
  .kpi.warn .value{color:var(--warn)}
  .kpi.ok .value{color:var(--ok)}
  .kpi .meta{font-size:12px;color:var(--muted);margin-top:6px}

  .btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;background:var(--brand);color:#fff;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--brand-2)}
  .btn-secondary{background:var(--soft);color:var(--brand)}
  .btn-secondary:hover{background:#dceaf3}
  .btn-danger{background:#fee2e2;color:#b91c1c}
  .btn-danger:hover{background:#fecaca}
  .btn-sm{padding:6px 12px;font-size:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--border);background:#fafbfc;position:sticky;top:0;z-index:1}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border)}
  tbody tr:hover{background:#fafbfc}
  tfoot td{font-weight:700;padding:11px 12px;background:#fafbfc;border-top:2px solid var(--border)}
  .balance-owed{font-weight:700;color:var(--warn)}
  .balance-zero{font-weight:700;color:var(--ok)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .neg{color:var(--warn)}
  .scroll-y{max-height:540px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}

  .form-row{display:grid;gap:14px;margin-bottom:14px}
  .form-row.cols-2{grid-template-columns:1fr 1fr}
  .form-row.cols-3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:700px){.form-row.cols-2,.form-row.cols-3{grid-template-columns:1fr}}

  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0d4a6b 0%,#1a7fb5 100%)}
  .login-card{background:#fff;width:100%;max-width:420px;border-radius:14px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .login-logo{display:flex;justify-content:center;margin-bottom:18px}
  .login-logo img{height:80px;width:auto}
  .login-title{text-align:center;font-size:20px;font-weight:700;margin:0 0 4px;color:var(--brand)}
  .login-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px}
  .login-help{margin-top:16px;padding:12px;background:var(--soft);border-radius:8px;font-size:12px;color:var(--muted)}
  .login-help b{color:var(--brand)}

  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:90vh;overflow:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal.lg{max-width:880px}
  .modal h2{margin:0 0 18px;font-size:18px;color:var(--brand)}
  .modal-footer{margin-top:20px;display:flex;gap:10px;justify-content:flex-end}

  .hidden{display:none !important}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .pill-admin{background:#fee2e2;color:#b91c1c}
  .pill-finance{background:#dbeafe;color:#1e40af}
  .pill-member{background:#dcfce7;color:#166534}
  .pill-dues{background:#dbeafe;color:#1e40af}
  .pill-join_fee{background:#e9d5ff;color:#6b21a8}
  .pill-special_contrib{background:#fef3c7;color:#92400e}
  .pill-gala{background:#fce7f3;color:#9d174d}
  .pill-birth{background:#dcfce7;color:#166534}
  .pill-death{background:#e7e5e4;color:#44403c}
  .pill-other{background:#e5e7eb;color:#374151}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f2937;color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;opacity:0;transform:translateY(10px);transition:.25s}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.ok{background:var(--ok)}
  .toast.err{background:var(--warn)}
  .empty{text-align:center;padding:36px;color:var(--muted);font-size:14px}
  .breakdown-year{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .breakdown-year:last-child{border-bottom:none}
  .breakdown-year .y-label{font-weight:600}
  .breakdown-year .y-detail{color:var(--muted);font-size:12px}
  .exempt{color:var(--muted);font-style:italic}
  .info-bar{background:#fffbea;border:1px solid #fde68a;color:#854d0e;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;padding:24px 0}
  .row-flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .filters input,.filters select{width:auto;min-width:140px}

  .event-card{background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:14px;flex-wrap:wrap}
  .event-card .ename{font-weight:700;color:var(--brand);font-size:14px}
  .event-card .emeta{font-size:12px;color:var(--muted);margin-top:3px}

  .coverage-year{margin-bottom:14px}
  .coverage-year h4{margin:0 0 8px;font-size:13px;color:var(--brand);font-weight:700}
  .coverage-row{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
  @media(max-width:700px){.coverage-row{grid-template-columns:repeat(6,1fr)}}
  .coverage-cell{aspect-ratio:1.4/1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border:1px solid var(--border);background:#fff;color:var(--muted);padding:3px}
  .coverage-cell.paid{background:#dcfce7;color:#166534;border-color:#86efac}
  .coverage-cell.unpaid{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
  .coverage-cell.prepaid{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
  .coverage-cell.exempt{background:#f3f4f6;color:#6b7280;border-color:#e5e7eb;font-style:italic}
  .coverage-cell.future{background:#fff;color:#cbd5e1;border-style:dashed}
  .coverage-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px}
  .coverage-legend span{display:inline-flex;align-items:center;gap:5px}
  .coverage-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .coverage-month-pill{display:inline-block;background:var(--soft);color:var(--brand);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin:1px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="root"></div>

<script>

/* =========================================================================
   ╔═══════════════════════════════════════════════════════════════════════╗
   ║  PASTE YOUR SUPABASE VALUES BELOW                                     ║
   ║  In Supabase: Settings → API → copy Project URL and "anon public" key ║
   ╚═══════════════════════════════════════════════════════════════════════╝
   ========================================================================= */
const SUPABASE_URL      = "https://msbeirrxxowlkifmqoxm.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zYmVpcnJ4eG93bGtpZm1xb3htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDQyMTMsImV4cCI6MjA5NDAyMDIxM30.B5FgO_UYFb3lyrpAP7PoWTCiqPrAG1xrIXpmoDpHJO8";
/* ===================== END CONFIG ===================== */

/* Auto-sanitize: trim whitespace, strip any path (so /rest/v1/, /auth/v1/, trailing /, etc. all work),
   and auto-correct if URL & key were pasted in swapped order. */
let _SB_URL = (typeof SUPABASE_URL === "string" ? SUPABASE_URL : "").trim();
let _SB_KEY = (typeof SUPABASE_ANON_KEY === "string" ? SUPABASE_ANON_KEY : "").trim();
if(_SB_URL.startsWith("eyJ") && /^https?:\/\//i.test(_SB_KEY)){
  const tmp = _SB_URL; _SB_URL = _SB_KEY; _SB_KEY = tmp;
  console.warn("Supabase URL and KEY were swapped — auto-corrected.");
}
const _hostMatch = _SB_URL.match(/^(https?:\/\/[^/]+)/i);
if(_hostMatch) _SB_URL = _hostMatch[1];

const SB_CONFIGURED = !!_SB_URL && !_SB_URL.startsWith("PASTE_") && /^https?:\/\//i.test(_SB_URL) &&
                      !!_SB_KEY && !_SB_KEY.startsWith("PASTE_") && _SB_KEY.length > 20;
const sb = SB_CONFIGURED ? window.supabase.createClient(_SB_URL, _SB_KEY) : null;
console.info("AICO portal —", SB_CONFIGURED ? ("Supabase connected to " + _SB_URL) : "Supabase not configured");

let CURRENT_PROFILE = null;
let REALTIME_CHANNEL = null;

function mapMemberFromDB(r){ return { id:r.id, firstName:r.first_name, lastName:r.last_name, address:r.address||"", city:r.city||"", state:r.state||"", zip:r.zip||"", email:r.email||"", phone:r.phone||"", joinDate:r.join_date, monthlyStartDate:r.monthly_start_date, status:r.status||"active", statusDate:r.status_date||null, statusNotes:r.status_notes||"" }; }
function mapMemberToDB(m){ return { id:m.id, first_name:m.firstName, last_name:m.lastName, address:m.address||null, city:m.city||null, state:m.state||null, zip:m.zip||null, email:m.email||null, phone:m.phone||null, join_date:m.joinDate, monthly_start_date:m.monthlyStartDate, status:m.status||"active", status_date:m.statusDate||null, status_notes:m.statusNotes||null }; }
function mapRecurringFromDB(r){ return { id:r.id, description:r.description, category:r.category||"", paidBy:r.paid_by||"", amount:Number(r.amount), startDate:r.start_date, endDate:r.end_date||null, dayOfMonth:r.day_of_month||1, active:r.active!==false, notes:r.notes||"" }; }
function mapRecurringToDB(r){ return { id:r.id, description:r.description, category:r.category||null, paid_by:r.paidBy||null, amount:r.amount, start_date:r.startDate, end_date:r.endDate||null, day_of_month:r.dayOfMonth||1, active:r.active!==false, notes:r.notes||null }; }
function mapPaymentFromDB(r){ return { id:r.id, memberId:r.member_id, date:r.date, amount:Number(r.amount), type:r.type, eventId:r.event_id, appliesTo:r.applies_to||undefined, notes:r.notes||"" }; }
function mapPaymentToDB(p){ return { id:p.id, member_id:p.memberId, date:p.date, amount:p.amount, type:p.type, event_id:p.eventId||null, applies_to:(p.appliesTo&&p.appliesTo.length)?p.appliesTo:null, notes:p.notes||null }; }
function mapEventFromDB(r){
  const ids = (r.beneficiary_member_ids && r.beneficiary_member_ids.length) ? r.beneficiary_member_ids : (r.beneficiary_member_id ? [r.beneficiary_member_id] : []);
  return { id:r.id, name:r.name, date:r.date, type:r.type, minAmount:Number(r.min_amount||0), description:r.description||"", beneficiaryMemberId:ids[0]||null, beneficiaryMemberIds:ids, isCouple:!!r.is_couple, beneficiaryShare:Number(r.beneficiary_share||0), aicoShare:Number(r.aico_share||0), raffleEnabled:!!r.raffle_enabled, ticketPrice:Number(r.ticket_price||0), winnerNotes:r.winner_notes||"" };
}
function mapEventToDB(e){
  const ids = (e.beneficiaryMemberIds && e.beneficiaryMemberIds.length) ? e.beneficiaryMemberIds : (e.beneficiaryMemberId ? [e.beneficiaryMemberId] : []);
  return { id:e.id, name:e.name, date:e.date, type:e.type, min_amount:e.minAmount||0, description:e.description||null, beneficiary_member_id:ids[0]||null, beneficiary_member_ids:ids.length?ids:null, is_couple:!!e.isCouple, beneficiary_share:e.beneficiaryShare||0, aico_share:e.aicoShare||0, raffle_enabled:!!e.raffleEnabled, ticket_price:e.ticketPrice||null, winner_notes:e.winnerNotes||null };
}
function mapExpenseFromDB(r){ return { id:r.id, date:r.date, amount:Number(r.amount), category:r.category||"", paidBy:r.paid_by||"", eventId:r.event_id, description:r.description||"", sourceRecurringId:r.source_recurring_id||null, sourcePeriod:r.source_period||null }; }
function mapExpenseToDB(x){ return { id:x.id, date:x.date, amount:x.amount, category:x.category||null, paid_by:x.paidBy||null, event_id:x.eventId||null, description:x.description||null, source_recurring_id:x.sourceRecurringId||null, source_period:x.sourcePeriod||null }; }
function mapContactFromDB(r){ return { id:r.id, firstName:r.first_name, lastName:r.last_name, email:r.email||"", phone:r.phone||"", address:r.address||"", city:r.city||"", state:r.state||"", zip:r.zip||"", notes:r.notes||"", status:r.status||"prospect", invitedAt:r.invited_at, joinedMemberId:r.joined_member_id, source:r.source||"" }; }
function mapContactToDB(c){ return { id:c.id, first_name:c.firstName, last_name:c.lastName, email:c.email||null, phone:c.phone||null, address:c.address||null, city:c.city||null, state:c.state||null, zip:c.zip||null, notes:c.notes||null, status:c.status||"prospect", invited_at:c.invitedAt||null, joined_member_id:c.joinedMemberId||null, source:c.source||null }; }
// Map payment with contact support
function mapPaymentFromDBv2(r){ return { id:r.id, memberId:r.member_id||null, contactId:r.contact_id||null, date:r.date, amount:Number(r.amount), type:r.type, eventId:r.event_id, appliesTo:r.applies_to||undefined, notes:r.notes||"", ticketCount:r.ticket_count||null, anonymousLabel:r.anonymous_label||null }; }
function mapPaymentToDBv2(p){ return { id:p.id, member_id:p.memberId||null, contact_id:p.contactId||null, date:p.date, amount:p.amount, type:p.type, event_id:p.eventId||null, applies_to:(p.appliesTo&&p.appliesTo.length)?p.appliesTo:null, notes:p.notes||null, ticket_count:p.ticketCount||null, anonymous_label:p.anonymousLabel||null }; }

async function loadAllFromSupabase(){
  const sess = (await sb.auth.getSession()).data.session;
  if(!sess){ CURRENT_PROFILE = null; return false; }
  const userId = sess.user.id;
  const { data: profile, error: pErr } = await sb.from("profiles").select("*").eq("id", userId).single();
  if(pErr){ console.error(pErr); CURRENT_PROFILE = null; return false; }
  CURRENT_PROFILE = profile;
  const [mRes, pRes, eRes, xRes, sRes, cRes, rRes] = await Promise.all([
    sb.from("members").select("*"),
    sb.from("payments").select("*"),
    sb.from("events").select("*"),
    sb.from("expenses").select("*"),
    sb.from("settings").select("value").eq("key","config").maybeSingle(),
    sb.from("contacts").select("*"),
    sb.from("recurring_expenses").select("*")
  ]);
  DB.members  = (mRes.data||[]).map(mapMemberFromDB);
  DB.payments = (pRes.data||[]).map(mapPaymentFromDBv2);
  DB.events   = (eRes.data||[]).map(mapEventFromDB);
  DB.expenses = (xRes.data||[]).map(mapExpenseFromDB);
  DB.contacts = (cRes.data||[]).map(mapContactFromDB);
  DB.recurringExpenses = (rRes.data||[]).map(mapRecurringFromDB);
  const cfg = sRes.data ? sRes.data.value : {};
  DB.settings = Object.assign({ oneTimeFee:25, monthlyFee:10, exemptYears:[2020,2021], orgName:"AICO", orgTagline:"Membership Portal", summaryStartYear:2017, summaryEndYear:2026, lang:"en", treasurerName:"Aminata Savane" }, cfg);
  // Silently ignore the v1 default paymentInstructions text (the new card uses i18n for Zelle/cash lines)
  const _legacyPI = "To pay your dues, contact AICO at 614-817-3021 via Zelle or cash.";
  if(DB.settings.paymentInstructions === _legacyPI) DB.settings.paymentInstructions = "";
  DB.users = [];
  if(profile.role === "admin"){
    const { data: users } = await sb.from("profiles").select("id, role, member_id, display_name, email");
    DB.users = (users||[]).map(u => ({ id:u.id, username:u.email||"", displayName:u.display_name||u.email||"", role:u.role, memberId:u.member_id }));
    await loadAuditLog();
  }
  if(profile.role === "admin" || profile.role === "finance"){
    try { await materializeRecurringExpenses(); } catch(e){ console.warn("recurring materialize:", e); }
  }
  return true;
}

async function materializeRecurringExpenses(){
  if(!sb || !DB.recurringExpenses || !DB.recurringExpenses.length) return;
  const today = new Date();
  const todayY = today.getFullYear();
  const todayM = today.getMonth();
  let createdAny = false;
  for(const re of DB.recurringExpenses){
    if(!re.active) continue;
    if(!re.startDate) continue;
    const sd = new Date(re.startDate + "T00:00:00");
    const ed = re.endDate ? new Date(re.endDate + "T00:00:00") : null;
    let y = sd.getFullYear(), m = sd.getMonth();
    while(y < todayY || (y === todayY && m <= todayM)){
      const period = `${y}-${String(m+1).padStart(2,'0')}`;
      const day = Math.min(28, re.dayOfMonth || 1);
      const dateStr = `${period}-${String(day).padStart(2,'0')}`;
      // Stop after end_date
      if(ed && new Date(dateStr+"T00:00:00") > ed) break;
      // Stop before start_date
      if(new Date(dateStr+"T00:00:00") < sd){ m++; if(m>11){m=0;y++;} continue; }
      // Skip if already materialized
      const expId = `ex-rec-${re.id}-${period}`;
      const exists = DB.expenses.some(e => e.id === expId || (e.sourceRecurringId===re.id && e.sourcePeriod===period));
      if(!exists){
        const exp = {
          id: expId,
          date: dateStr,
          amount: re.amount,
          category: re.category || "Operations",
          paidBy: re.paidBy || "",
          description: re.description,
          sourceRecurringId: re.id,
          sourcePeriod: period
        };
        const { error } = await sb.from("expenses").upsert(mapExpenseToDB(exp), { onConflict:'id', ignoreDuplicates:true });
        if(!error) createdAny = true;
      }
      m++; if(m>11){m=0;y++;}
    }
  }
  if(createdAny){
    const { data: xRes } = await sb.from("expenses").select("*");
    DB.expenses = (xRes||[]).map(mapExpenseFromDB);
  }
}

function subscribeRealtime(){
  if(REALTIME_CHANNEL){ try{ sb.removeChannel(REALTIME_CHANNEL); }catch(e){} }
  REALTIME_CHANNEL = sb.channel("aico-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"members" },  reloadAndRender)
    .on("postgres_changes", { event:"*", schema:"public", table:"payments" }, reloadAndRender)
    .on("postgres_changes", { event:"*", schema:"public", table:"events" },   reloadAndRender)
    .on("postgres_changes", { event:"*", schema:"public", table:"expenses" }, reloadAndRender)
    .on("postgres_changes", { event:"*", schema:"public", table:"settings" }, reloadAndRender)
    .on("postgres_changes", { event:"*", schema:"public", table:"profiles" }, reloadAndRender)
    .on("postgres_changes", { event:"*", schema:"public", table:"contacts" }, reloadAndRender)
    .on("postgres_changes", { event:"*", schema:"public", table:"audit_log" }, reloadAndRender)
    .on("postgres_changes", { event:"*", schema:"public", table:"recurring_expenses" }, reloadAndRender)
    .subscribe();
}
let _reloadTimer = null;
function reloadAndRender(){
  if(_reloadTimer) clearTimeout(_reloadTimer);
  _reloadTimer = setTimeout(async ()=>{ await loadAllFromSupabase(); render(); }, 300);
}
function saveDB(){ /* no-op in Supabase mode */ }

async function setSession(u){
  if(u){ SESSION = {userId:u.id}; sessionStorage.setItem("aico_session",JSON.stringify(SESSION)); }
  else {
    SESSION = null; sessionStorage.removeItem("aico_session");
    CURRENT_PROFILE = null;

}
function currentUser(){

    id: CURRENT_PROFILE.id,

    memberId: CURRENT_PROFILE.member_id

}

function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,9); }
function fmtMoney(n){ const v = Number(n||0); return (v<0?"-":"") + "$" + Math.abs(Math.round(v*100)/100).toFixed(2); }
function fmtMoneyOrBlank(n){ return n ? fmtMoney(n) : ""; }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escape(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ymKey(d){ return d.slice(0,7); }
function ymLabel(ym){ const [y,m]=ym.split("-"); return new Date(+y,+m-1,1).toLocaleDateString(undefined,{year:"numeric",month:"short"}); }

    </select>

  </div>`;

function bindBeneficiaryPicker(modal, prefix, initialIds, onChange){
  let ids = (initialIds||[]).slice();
  const pillsDiv = modal.querySelector("#"+prefix+"_benef_pills");
  const addSel = modal.querySelector("#"+prefix+"_benef_add");
  function refreshSelect(){
    const opts = DB.members.slice().sort((a,b)=>a.lastName.localeCompare(b.lastName))
      .filter(m=>!ids.includes(m.id))
      .map(m=>`<option value="${m.id}">${escape(m.lastName)}, ${escape(m.firstName)}</option>`).join("");
    addSel.innerHTML = `<option value="">+ ${t("add_new")} ${t("beneficiary").toLowerCase()}…</option>${opts}`;
  }
  function refreshPills(){
    if(ids.length===0){
      pillsDiv.innerHTML = `<span style="color:var(--muted);font-size:12px;font-style:italic;padding:4px">${t("none_opt")}</span>`;
    } else {
      pillsDiv.innerHTML = ids.map(id=>{
        const m = DB.members.find(x=>x.id===id);
        const name = m ? escape(m.firstName+' '+m.lastName) : '?';
        return `<span class="pill pill-member" style="display:inline-flex;align-items:center;gap:8px;font-size:12px;padding:5px 10px">${name}<a href="#" data-remove="${id}" style="color:#166534;text-decoration:none;font-weight:700;font-size:14px;line-height:1">×</a></span>`;
      }).join("");
      pillsDiv.querySelectorAll("[data-remove]").forEach(a=>a.addEventListener("click", e=>{
        e.preventDefault();
        ids = ids.filter(x=>x !== a.dataset.remove);
        refreshSelect(); refreshPills();
        if(onChange) onChange(ids);
      }));
    }
  }
  addSel.addEventListener("change", ()=>{
    if(addSel.value){
      ids.push(addSel.value);
      addSel.value = "";
      refreshSelect(); refreshPills();
      if(onChange) onChange(ids);
    }
  });
  refreshSelect(); refreshPills();
  return { getIds: ()=>ids.slice() };
}

/* AICO Statut (Annex) splits — beneficiary share vs AICO share */
function aicoStatutSplit(eventType, isCouple){
  if(eventType==="birth"){ return isCouple ? {b:0.75, a:0.25} : {b:0.50, a:0.50}; }
  if(eventType==="death"){ return isCouple ? {b:0.85, a:0.15} : {b:0.75, a:0.25}; }
  return null; // other types have no automatic split
}
function memberIsEligible(member){
  if(!member) return {ok:false, reason:"no_member"};
  const d = calcMemberDues(member);
  if(d.balance > 0) return {ok:false, reason:"balance_due", balance:d.balance};
  return {ok:true};
}

/* ---- Text/address/phone normalization ---- */
function titleCase(s){
  if(!s) return "";
  return String(s).toLowerCase().replace(/\b([a-zà-ÿ])([a-zà-ÿ']*)/g,(_,a,b)=>a.toUpperCase()+b);
}
function normState(s){ return (s||"").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,2); }
function normZip(s){ return (s||"").replace(/[^0-9-]/g,"").slice(0,10); }
function normalizeMember(m){
  if(m.address!=null) m.address = titleCase(m.address);
  if(m.city!=null) m.city = titleCase(m.city);
  if(m.state!=null) m.state = normState(m.state);
  if(m.zip!=null) m.zip = normZip(m.zip);
  if(m.phone!=null) m.phone = formatPhone(m.phone);
  if(m.email!=null) m.email = (m.email||"").trim().toLowerCase();
  if(m.firstName!=null) m.firstName = titleCase(m.firstName);
  if(m.lastName!=null) m.lastName = titleCase(m.lastName);
  return m;
}
function formatPhone(s){
  if(!s) return "";
  const d = String(s).replace(/\D/g,"");
  if(d.length===10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  if(d.length===11 && d.startsWith("1")) return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  return s.trim();
}
function fullAddress(m){
  if(!m) return "";
  const parts = [];
  if(m.address) parts.push(titleCase(m.address));
  const cityStateZip = [titleCase(m.city||""), [normState(m.state||""), (m.zip||"").trim()].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  if(cityStateZip) parts.push(cityStateZip);
  return parts.join(", ");
}

function currentLang(){ return (DB && DB.settings && DB.settings.lang) || "en"; }
function t(key, vars){
  const lang = currentLang();
  let s = (I18N[lang] && I18N[lang][key]) || (I18N.en[key]) || key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.replace(new RegExp("\\{"+k+"\\}","g"), vars[k]); });
  return s;
}
function setLang(lang){
  DB.settings.lang = lang;
  if(SB_CONFIGURED && CURRENT_PROFILE && CURRENT_PROFILE.role === "admin"){
    sb.from("settings").upsert({ key:"config", value:DB.settings }).then(()=>{});
  }
  render();
}

function toast(msg, type){
  const t=document.createElement("div");
  t.className="toast " + (type||"");
  t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),300); },2400);
}

function chargeableMonthsList(monthlyStart, member){
  if(!monthlyStart) return [];
  const start = new Date(monthlyStart+"T00:00:00");
  // End date: today, OR member's status_date if non-active and earlier
  let endDate = new Date();
  if(member && member.status && member.status !== "active" && member.statusDate){
    const sd = new Date(member.statusDate+"T00:00:00");
    if(sd < endDate) endDate = sd;
  }
  const out = [];
  let y = start.getFullYear(); let m = start.getMonth();
  const endY = endDate.getFullYear(); const endM = endDate.getMonth();
  while(y < endY || (y===endY && m<=endM)){
    if(!DB.settings.exemptYears.includes(y)) out.push({year:y, month:m});
    m++; if(m>11){m=0;y++;}
  }
  return out;
}
function ymOf(year, monthIdx){ return `${year}-${String(monthIdx+1).padStart(2,'0')}`; }
function ymAdd(ym, delta){
  let [y,m]=ym.split("-").map(Number); m=m-1+delta;
  while(m<0){m+=12;y--;} while(m>11){m-=12;y++;}
  return ymOf(y,m);
}
function isExemptYM(ym, exemptYears){
  const y = parseInt(ym.slice(0,4),10);
  return exemptYears.includes(y);
}

/* Allocate payments to specific months (join fee + dues). */
function buildMonthAllocations(member){
  const monthlyFee = DB.settings.monthlyFee;
  const oneTimeFee = DB.settings.oneTimeFee;
  const exempt = DB.settings.exemptYears;
  const chargeable = chargeableMonthsList(member.monthlyStartDate, member);
  const billedYMs = chargeable.map(c=>ymOf(c.year,c.month));
  const billedSet = new Set(billedYMs);

  const paidPerYM = new Map();   // ym -> $ applied
  let joinFeePaid = 0;
  let surplus = 0;               // money paid but not yet allocated

  const memberPayments = DB.payments
    .filter(p=>p.memberId===member.id && (p.type==="dues" || p.type==="join_fee"))
    .slice()
    .sort((a,b)=>a.date.localeCompare(b.date));

  for(const p of memberPayments){
    let remaining = Number(p.amount||0);

    if(p.type==="join_fee"){
      const need = Math.max(0, oneTimeFee - joinFeePaid);
      const apply = Math.min(remaining, need);
      joinFeePaid += apply; remaining -= apply;
      surplus += remaining;
      continue;
    }

    // type === "dues"
    if(p.appliesTo && p.appliesTo.length>0){
      // Apply to specified months in order, skipping exempt years
      for(const ym of p.appliesTo){
        if(remaining<=0) break;
        if(isExemptYM(ym, exempt)) continue;
        const already = paidPerYM.get(ym)||0;
        const need = monthlyFee - already;
        if(need<=0) continue;
        const apply = Math.min(remaining, need);
        paidPerYM.set(ym, already + apply);
        remaining -= apply;
      }
      surplus += remaining;
    } else {
      // Auto-FIFO: oldest unpaid billed month first
      for(const ym of billedYMs){
        if(remaining<=0) break;
        const already = paidPerYM.get(ym)||0;
        const need = monthlyFee - already;
        if(need<=0) continue;
        const apply = Math.min(remaining, need);
        paidPerYM.set(ym, already + apply);
        remaining -= apply;
      }
      // Then continue prepaying FUTURE months in order
      if(remaining > 0 && billedYMs.length){
        let nextYM = ymAdd(billedYMs[billedYMs.length-1], 1);
        let safety = 0;
        while(remaining > 0 && safety < 360){ // up to 30 years prepay safety
          if(!isExemptYM(nextYM, exempt)){
            const already = paidPerYM.get(nextYM)||0;
            const need = monthlyFee - already;
            if(need > 0){
              const apply = Math.min(remaining, need);
              paidPerYM.set(nextYM, already + apply);
              remaining -= apply;
            }
          }
          nextYM = ymAdd(nextYM, 1);
          safety++;
        }
      }
      surplus += remaining;
    }
  }

  // Build per-month status for BILLED months
  const billedMonths = billedYMs.map(ym=>{
    const amt = paidPerYM.get(ym) || 0;
    return { ym, paid: amt >= monthlyFee, amount: amt };
  });

  // Prepaid (future) months — anything in paidPerYM not in billedSet
  const prepaidMonths = [];
  paidPerYM.forEach((amt, ym)=>{
    if(!billedSet.has(ym) && amt > 0){
      prepaidMonths.push({ ym, paid: amt >= monthlyFee, amount: amt });
    }
  });
  prepaidMonths.sort((a,b)=>a.ym.localeCompare(b.ym));

  const unpaidBilled = billedMonths.filter(m=>!m.paid);
  const monthsBilledOwed = unpaidBilled.reduce((s,m)=>s + (monthlyFee - m.amount), 0);
  const joinFeeOwed = Math.max(0, oneTimeFee - joinFeePaid);
  const balance = Math.max(0, joinFeeOwed + monthsBilledOwed - surplus);
  const credit = Math.max(0, surplus - joinFeeOwed - monthsBilledOwed);

  // Find last fully-paid billed month and last prepaid month
  let paidThrough = null;
  for(const m of billedMonths){ if(m.paid) paidThrough = m.ym; else break; }
  let prepaidThrough = null;
  if(prepaidMonths.length){
    for(const m of prepaidMonths){ if(m.paid) prepaidThrough = m.ym; else break; }
  }

  return { billedMonths, prepaidMonths, joinFeePaid, joinFeeOwed, surplus, balance, credit, paidThrough, prepaidThrough };
}

function calcMemberDues(member){
  const months = chargeableMonthsList(member.monthlyStartDate, member);
  const monthlyTotal = months.length * DB.settings.monthlyFee;
  const total = DB.settings.oneTimeFee + monthlyTotal;
  const paid = DB.payments
    .filter(p=>p.memberId===member.id && (p.type==="dues" || p.type==="join_fee"))
    .reduce((s,p)=>s+Number(p.amount||0),0);
  const alloc = buildMonthAllocations(member);
  return {
    months, monthlyTotal, oneTime:DB.settings.oneTimeFee, total, paid,
    balance: alloc.balance,
    alloc
  };
}

function yearlyBreakdown(member){
  const months = chargeableMonthsList(member.monthlyStartDate, member);
  const alloc = buildMonthAllocations(member);
  const paidSet = new Set(alloc.billedMonths.filter(m=>m.paid).map(m=>m.ym));
  const prepaidSet = new Set(alloc.prepaidMonths.filter(m=>m.paid).map(m=>m.ym));

  // Group billed months by year
  const byYear = {};
  months.forEach(({year, month})=>{
    if(!byYear[year]) byYear[year]={year, months:0, paid:0, ymList:[]};
    byYear[year].months++;
    const ym = ymOf(year,month);
    byYear[year].ymList.push(ym);
    if(paidSet.has(ym)) byYear[year].paid++;
  });
  // Also fold prepaid months into their year
  const prepaidByYear = {};
  alloc.prepaidMonths.forEach(({ym, paid})=>{
    if(!paid) return;
    const y = parseInt(ym.slice(0,4),10);
    prepaidByYear[y] = (prepaidByYear[y]||0) + 1;
  });

  const startY = new Date(member.monthlyStartDate+"T00:00:00").getFullYear();
  const endY = Math.max(new Date().getFullYear(), ...Object.keys(prepaidByYear).map(Number).concat([0]));
  const rows = [];
  for(let y=startY;y<=endY;y++){
    if(DB.settings.exemptYears.includes(y)){
      rows.push({year:y, exempt:true, months:0, paid:0, amount:0, prepaid: prepaidByYear[y]||0});
    } else {
      const data = byYear[y] || {months:0, paid:0};
      rows.push({
        year:y, exempt:false,
        months:data.months, paid:data.paid,
        amount:data.months*DB.settings.monthlyFee,
        prepaid: prepaidByYear[y]||0
      });
    }
  }
  return rows;
}

function describeCovers(p){
  if(p.type!=="dues" && p.type!=="join_fee") return "—";
  if(p.type==="join_fee") return '<span class="coverage-month-pill">'+t("payment_types_join_fee")+'</span>';
  if(!p.appliesTo || !p.appliesTo.length) return '<span style="color:var(--muted);font-size:11px;font-style:italic">'+t("auto_oldest_unpaid")+'</span>';
  const arr = p.appliesTo.slice().sort();
  // Compress consecutive months into ranges
  const ranges = [];
  let i=0;
  while(i<arr.length){
    let j=i;
    while(j+1<arr.length && ymAdd(arr[j],1)===arr[j+1]) j++;
    ranges.push(j===i?arr[i]:`${arr[i]}–${arr[j]}`);
    i=j+1;
  }
  return ranges.map(r=>{
    if(r.includes("–")){
      const [a,b]=r.split("–");
      return `<span class="coverage-month-pill">${ymLabel(a).replace(/, /,' ')} → ${ymLabel(b).replace(/, /,' ')}</span>`;
    }
    return `<span class="coverage-month-pill">${ymLabel(r).replace(/, /,' ')}</span>`;
  }).join(" ");
}

function renderCoverageMap(member, alloc){
  const exempt = DB.settings.exemptYears;
  const startY = new Date(member.monthlyStartDate+"T00:00:00").getFullYear();
  const startM = new Date(member.monthlyStartDate+"T00:00:00").getMonth();
  // Determine end year: at least current year, extending to last prepaid year
  let endY = new Date().getFullYear();
  alloc.prepaidMonths.forEach(m=>{ const y=parseInt(m.ym.slice(0,4),10); if(y>endY) endY=y; });

  const paidBilled = new Set(alloc.billedMonths.filter(m=>m.paid).map(m=>m.ym));
  const unpaidBilled = new Set(alloc.billedMonths.filter(m=>!m.paid).map(m=>m.ym));
  const prepaidSet = new Set(alloc.prepaidMonths.filter(m=>m.paid).map(m=>m.ym));

  const today = new Date();
  const todayY = today.getFullYear();
  const todayM = today.getMonth();

  const yearBlocks = [];
  for(let y=startY; y<=endY; y++){
    const isExempt = exempt.includes(y);
    const cells = [];
    for(let m=0; m<12; m++){
      const ym = ymOf(y,m);
      const monthShort = new Date(y,m,1).toLocaleString(undefined,{month:'short'});
      // Skip months before member's start (in their start year)
      const beforeStart = (y===startY && m<startM);
      const isFuture = (y>todayY) || (y===todayY && m>todayM);
      let cls, label;
      const monthShortLocal = new Date(y,m,1).toLocaleString(currentLang()==='fr'?'fr-FR':undefined,{month:'short'});
      if(beforeStart){ cls="future"; label=`<div>${monthShortLocal}</div><div style="font-size:9px">—</div>`; }
      else if(isExempt){ cls="exempt"; label=`<div>${monthShortLocal}</div><div style="font-size:9px">${t("exempt_status")}</div>`; }
      else if(paidBilled.has(ym)){ cls="paid"; label=`<div>${monthShortLocal}</div><div style="font-size:9px">${t("paid_status")}</div>`; }
      else if(prepaidSet.has(ym)){ cls="prepaid"; label=`<div>${monthShortLocal}</div><div style="font-size:9px">${t("prepaid_status")}</div>`; }
      else if(unpaidBilled.has(ym)){ cls="unpaid"; label=`<div>${monthShortLocal}</div><div style="font-size:9px">${t("unpaid_status")}</div>`; }
      else if(isFuture){ cls="future"; label=`<div>${monthShortLocal}</div><div style="font-size:9px">—</div>`; }
      else { cls="future"; label=`<div>${monthShortLocal}</div><div style="font-size:9px">—</div>`; }
      cells.push(`<div class="coverage-cell ${cls}" title="${ym}">${label}</div>`);
    }
    yearBlocks.push(`<div class="coverage-year"><h4>${y}${isExempt?' — '+t("legend_exempt"):''}</h4><div class="coverage-row">${cells.join("")}</div></div>`);
  }

  return `<div class="card">
    <h3>${t("monthly_coverage")}</h3>
    <div class="coverage-legend">
      <span><span class="dot" style="background:#dcfce7;border:1px solid #86efac"></span> ${t("legend_paid")}</span>
      <span><span class="dot" style="background:#fee2e2;border:1px solid #fca5a5"></span> ${t("legend_unpaid")}</span>
      <span><span class="dot" style="background:#dbeafe;border:1px solid #93c5fd"></span> ${t("legend_prepaid")}</span>
      <span><span class="dot" style="background:#f3f4f6;border:1px solid #e5e7eb"></span> ${t("legend_exempt")}</span>
    </div>
    ${yearBlocks.join("")}
  </div>`;
}

function buildMonthlySummary(yearFrom, yearTo){
  const joins = {};
  DB.members.forEach(m=>{ if(m.joinDate){ const ym=ymKey(m.joinDate); joins[ym]=(joins[ym]||0)+1; } });
  const buckets = {};
  DB.payments.forEach(p=>{
    if(!p.date) return;
    const ym = ymKey(p.date);
    if(!buckets[ym]) buckets[ym] = {dues:0, join_fee:0, special_contrib:0, gala:0};
    if(buckets[ym][p.type]===undefined) buckets[ym][p.type]=0;
    buckets[ym][p.type] += Number(p.amount||0);
  });
  const expensesByMonth = {};
  DB.expenses.forEach(e=>{ if(e.date){ const ym=ymKey(e.date); expensesByMonth[ym]=(expensesByMonth[ym]||0)+Number(e.amount||0); } });

  const rows = [];
  for(let y=yearFrom; y<=yearTo; y++){
    for(let m=0; m<12; m++){
      const ym = `${y}-${String(m+1).padStart(2,'0')}`;
      const joined = joins[ym]||0;
      const b = buckets[ym]||{dues:0, join_fee:0, special_contrib:0, gala:0};
      const collected = (b.dues||0)+(b.join_fee||0)+(b.special_contrib||0)+(b.gala||0);
      const expenses = expensesByMonth[ym]||0;
      rows.push({
        ym, year:y, monthIdx:m, joined,
        joinFees: b.join_fee||0, duesCollected: b.dues||0,
        specialContrib: b.special_contrib||0, galaCollected: b.gala||0,
        totalCollected: collected, expenses, netTotal: collected - expenses
      });
    }
  }
  return rows;
}

function bindLogin(){
  bindLangToggle();

  // Mode tabs
  document.querySelectorAll(".login-tab").forEach(b => b.addEventListener("click", () => {
    // Capture email if user typed one before switching
    const e1 = document.getElementById("li_user"); const e2 = document.getElementById("su_email");
    if(e1 && e1.value) LOGIN_EMAIL = e1.value.trim();
    else if(e2 && e2.value) LOGIN_EMAIL = e2.value.trim();
    LOGIN_MODE = b.dataset.mode;
    render();
  }));

  // Sign in form
  const loginForm = document.getElementById("loginForm");
  if(loginForm){
    loginForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const email = document.getElementById("li_user").value.trim();
      const password = document.getElementById("li_pass").value;
      LOGIN_EMAIL = email;
      if(!SB_CONFIGURED){ toast("Supabase not configured. Paste your URL + anon key near the top of the HTML.","err"); return; }
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        let hint = "";
        const m = (error.message||"").toLowerCase();
        if(m.includes("invalid path") || m.includes("not found") || m.includes("failed to fetch")){
          hint = " (check your SUPABASE_URL — it should be like https://xxxxx.supabase.co with no extra path)";
        } else if(m.includes("invalid login") || m.includes("invalid email") || m.includes("invalid credentials")){
          hint = " (email or password is wrong, or email not confirmed yet)";
        }
        console.warn("Login error:", error, "URL:", _SB_URL);
        toast("Login failed: " + (error.message || "unknown") + hint, "err");
        return;
      }
      const ok = await loadAllFromSupabase();
      if(!ok){ toast("Could not load profile.","err"); return; }
      VIEW = CURRENT_PROFILE.role==="admin" ? "admin" : CURRENT_PROFILE.role==="finance" ? "finance" : "dashboard";
      render();
      subscribeRealtime();
    });
  }

  // "Forgot password?" link
  const forgotLink = document.getElementById("forgotPasswordLink");
  if(forgotLink) forgotLink.addEventListener("click", e=>{
    e.preventDefault();
    LOGIN_EMAIL = (document.getElementById("li_user")?.value || "").trim();
    LOGIN_MODE = "forgot";
    render();
  });

  // Signup form
  const signupForm = document.getElementById("signupForm");
  if(signupForm){
    const pass = document.getElementById("su_pass");
    const pass2 = document.getElementById("su_pass2");
    const warn = document.getElementById("su_match_warn");
    function checkMatch(){
      if(pass2.value && pass.value !== pass2.value){
        warn.style.display = ""; pass2.style.borderColor = "var(--warn)";
      } else {
        warn.style.display = "none"; pass2.style.borderColor = "";
      }
    }
    pass.addEventListener("input", checkMatch);
    pass2.addEventListener("input", checkMatch);

    signupForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const email = document.getElementById("su_email").value.trim();
      const password = pass.value;
      const password2 = pass2.value;
      if(password.length < 8){ toast(t("password_too_short"),"err"); return; }
      if(password !== password2){ toast(t("passwords_dont_match"),"err"); return; }
      LOGIN_EMAIL = email;
      if(!SB_CONFIGURED){ toast("Supabase not configured.","err"); return; }
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { emailRedirectTo: window.location.origin + window.location.pathname }
      });
      if(error){ toast(error.message,"err"); return; }
      // If email confirmation is disabled in Supabase, signUp returns a session — log them in directly.
      if(data && data.session){
        const ok = await loadAllFromSupabase();
        if(ok){
          VIEW = CURRENT_PROFILE.role==="admin" ? "admin" : CURRENT_PROFILE.role==="finance" ? "finance" : "dashboard";
          render(); subscribeRealtime();
          return;
        }
      }
      LOGIN_MODE = "signup_success";
      render();
    });
  }

  // Forgot password form
  const forgotForm = document.getElementById("forgotForm");
  if(forgotForm){
    forgotForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const email = document.getElementById("fp_email").value.trim();
      LOGIN_EMAIL = email;
      if(!SB_CONFIGURED){ toast("Supabase not configured.","err"); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });
      if(error){ toast(error.message,"err"); return; }
      LOGIN_MODE = "forgot_success";
      render();
    });
  }

  // Back to sign in (link and button)
  const backLink = document.getElementById("backToSigninLink");
  if(backLink) backLink.addEventListener("click", e=>{ e.preventDefault(); LOGIN_MODE = "signin"; render(); });
  const backBtn = document.getElementById("backToSigninBtn");
  if(backBtn) backBtn.addEventListener("click", ()=>{ LOGIN_MODE = "signin"; render(); });
}

function bindApp(user){
  document.getElementById("logoutBtn").addEventListener("click", async ()=>{ if(REALTIME_CHANNEL){try{sb.removeChannel(REALTIME_CHANNEL);}catch(e){}REALTIME_CHANNEL=null;} await setSession(null); _bootstrapped=false; render(); });
  document.querySelectorAll(".tab").forEach(tb=>{ tb.addEventListener("click", ()=>{ VIEW = tb.dataset.tab; render(); }); });
  bindLangToggle();
  renderView(user);
}

function renderView(user){
  if(VIEW==="dashboard") return renderMemberDashboard(user);
  if(VIEW==="finance" && (user.role==="finance"||user.role==="admin")) return renderFinanceDashboard(user);
  if(VIEW==="admin" && user.role==="admin") return renderAdminDashboard(user);
  VIEW="dashboard"; renderMemberDashboard(user);
}

function renderFinanceDashboard(user){
  const view = document.getElementById("view");
  const memberStats = DB.members.map(m=>({m, d: calcMemberDues(m)})).sort((a,b)=>b.d.balance - a.d.balance);
  const totalOwed = memberStats.reduce((s,r)=>s+r.d.balance,0);
  const totalCollected = DB.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalBilledDues = memberStats.reduce((s,r)=>s+r.d.total,0);
  const totalExpenses = DB.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const netTotal = totalCollected - totalExpenses;

  view.innerHTML = `
    <h1 class="page-title">${t("fin_dashboard")}</h1>
    <p class="page-sub">${t("fin_subtitle")}</p>

    <div class="grid grid-6" style="margin-bottom:18px">

      <div class="kpi ok"><div class="label">${t("total_collected")}</div><div class="value">${fmtMoney(totalCollected)}</div></div>
      <div class="kpi ${totalExpenses>0?'warn':''}"><div class="label">${t("expenses")}</div><div class="value">${fmtMoney(totalExpenses)}</div></div>
      <div class="kpi ${netTotal>=0?'ok':'warn'}"><div class="label">${t("net_total")}</div><div class="value">${fmtMoney(netTotal)}</div></div>
      <div class="kpi ${totalOwed>0?'warn':'ok'}"><div class="label">${t("outstanding_dues")}</div><div class="value">${fmtMoney(totalOwed)}</div></div>
    </div>

    <div class="row-flex">
      <div></div>
      <div class="actions">
        <button class="btn" id="btnAddMember">${t("add_member")}</button>
        <button class="btn btn-secondary" id="btnAddPayment">${t("record_payment")}</button>
        <button class="btn btn-secondary" id="btnAddExpense">${t("record_expense")}</button>

    ${renderContactsCard()}
    ${renderMembersFullCard("finMembersTable", "finMemberSearch", "finBalanceFilter", false)}
    ${renderMonthlySummaryCard()}
  `;

  document.getElementById("btnAddMember").addEventListener("click", ()=>openAddMember());
  document.getElementById("btnAddPayment").addEventListener("click", ()=>openAddPayment());
  document.getElementById("btnAddExpense").addEventListener("click", ()=>openAddExpense());
  document.getElementById("btnAddEvent").addEventListener("click", ()=>openAddEvent());
  bindEventsCard();
  bindExpensesCard();

  bindMembersFullCard("finMembersTable", "finMemberSearch", "finBalanceFilter", false);
  bindMonthlySummary();

function renderMembersFullCard(tableId, searchId, filterId, allowDelete){
  return `<div class="card"><h3>${t("all_members_balances")}</h3>${renderMembersFullCardInner(tableId, searchId, filterId, allowDelete)}</div>`;
}
function renderMembersFullCardInner(tableId, searchId, filterId, allowDelete){
  return `
    <div class="filters" style="margin-top:14px">
      <input id="${searchId}" placeholder="${t("search_name")}" />
      <select id="${filterId}">
        <option value="all">${t("all_members")}</option>
        <option value="owing">${t("owing_only")}</option>
        <option value="paid">${t("paid_in_full_opt")}</option>
      </select>
    </div>
    <div class="scroll-y">
    ${DB.members.length===0 ? `<div class="empty">${t("no_members")}</div>` :
      `<table id="${tableId}">
        <thead><tr><th>${t("name")}</th><th>${t("contact")}</th><th>${t("joined")}</th><th>${t("monthly_start")}</th><th>${t("paid_through")}</th><th class="num">${t("billed")}</th><th class="num">${t("paid_col")}</th><th class="num">${t("balance")}</th><th>${t("actions")}</th></tr></thead>
        <tbody>${DB.members.slice().sort((a,b)=>a.lastName.localeCompare(b.lastName)).map(m=>{
          const d = calcMemberDues(m);
          const pt = d.alloc.paidThrough ? ymLabel(d.alloc.paidThrough) : '—';
          const pp = d.alloc.prepaidThrough ? `<div style="font-size:10px;color:var(--brand-2)">${t("prepaid_lc")} → ${ymLabel(d.alloc.prepaidThrough)}</div>` : '';
          return `<tr data-name="${escape((m.firstName+' '+m.lastName).toLowerCase())}" data-balance="${d.balance>0?'owing':'paid'}">

function bindMembersFullCard(tableId, searchId, filterId, allowDelete){
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>openEditMember(b.dataset.edit)));
  document.querySelectorAll("[data-pay]").forEach(b=>b.addEventListener("click", ()=>openAddPayment(b.dataset.pay)));
  document.querySelectorAll("[data-viewp]").forEach(b=>b.addEventListener("click", ()=>openViewPayments(b.dataset.viewp)));
  if(allowDelete) document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", ()=>deleteMember(b.dataset.del)));
  const search = document.getElementById(searchId);
  const balFilter = document.getElementById(filterId);
  function apply(){
    const q = (search.value||"").toLowerCase().trim();
    const bf = balFilter.value;
    document.querySelectorAll("#"+tableId+" tbody tr").forEach(tr=>{
      const okName = !q || tr.dataset.name.includes(q);
      const okBal = bf==="all" || tr.dataset.balance===(bf==="owing"?"owing":"paid");
      tr.style.display = (okName && okBal) ? "" : "none";
    });
  }
  if(search) search.addEventListener("input", apply);
  if(balFilter) balFilter.addEventListener("change", apply);
}

/* ---- Events ---- */
function renderEventsCard(){
  return `<div class="card">
    <div class="row-flex" style="margin-bottom:0">
      <h3 style="margin:0">${t("events_title")}</h3>
      <button class="btn btn-sm" id="btnNewEventInline">${t("new_event")}</button>
    </div>
    ${renderEventsCardInner()}
  </div>`;
}
function renderEventsCardInner(){
  const statutBanner = `<div class="info-bar" style="background:#eef4f9;border-color:#bcdcee;color:#0d4a6b;margin-top:14px"><b>${t("statut_info_title")}</b><br>${t("statut_info_body")}</div>`;
  if(DB.events.length===0) return statutBanner + `<div class="empty" style="margin-top:14px">${t("no_events")}</div>`;
  return statutBanner + `<div style="margin-top:14px">${DB.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(ev=>{
    const contribs = contributionsForEvent(ev.id);
    const total = contribs.reduce((s,p)=>s+Number(p.amount||0),0);
    const contribLabel = contribs.length===1?t("contributor"):t("contributors");
    const benefIdsList = ev.beneficiaryMemberIds && ev.beneficiaryMemberIds.length
      ? ev.beneficiaryMemberIds
      : (ev.beneficiaryMemberId ? [ev.beneficiaryMemberId] : []);
    const benefs = benefIdsList.map(id => DB.members.find(m=>m.id===id)).filter(Boolean);
    const bShare = Number(ev.beneficiaryShare||0)/100;
    const aShare = Number(ev.aicoShare||0)/100;
    const benefAmt = total*bShare, aicoAmt = total*aShare;
    const benefNames = benefs.map(b=>escape(b.firstName+' '+b.lastName)).join(", ");
    return `<div class="event-card">
      <div style="flex:1;min-width:200px">
        <div class="ename">${escape(ev.name)} <span class="pill pill-${ev.type}">${eventTypeLabel(ev.type)}</span>${ev.isCouple&&benefs.length===1?' <span class="pill pill-other">Couple</span>':''}${benefs.length>1?` <span class="pill pill-other">${benefs.length} ${t("beneficiary").toLowerCase()}s</span>`:''}</div>
        <div class="emeta">${fmtDate(ev.date)} · ${t("minimum")} ${fmtMoney(ev.minAmount)} · ${contribs.length} ${contribLabel} · ${t("total_raised")}: <b>${fmtMoney(total)}</b></div>
        ${benefs.length?`<div class="emeta" style="margin-top:4px">${t("beneficiary")}${benefs.length>1?'s':''}: <b>${benefNames}</b> · ${t("beneficiary_share")}: <b>${ev.beneficiaryShare}% (${fmtMoney(benefAmt)})</b> · ${t("aico_share")}: <b>${ev.aicoShare}% (${fmtMoney(aicoAmt)})</b></div>`:""}
        ${ev.description?`<div class="emeta" style="margin-top:4px">${escape(ev.description)}</div>`:""}
      </div>
      <div class="actions">
        <button class="btn btn-sm btn-secondary" data-eopen="${ev.id}">${t("view_log")}</button>
        <button class="btn btn-sm btn-danger" data-edel="${ev.id}">${t("del")}</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}
function bindEventsCard(){
  document.querySelectorAll("[data-eopen]").forEach(b=>b.addEventListener("click", ()=>openEventView(b.dataset.eopen)));

  switch(s){

    case "declined": return "background:#fee2e2;color:#991b1b";
    case "joined":   return "background:#dcfce7;color:#166534";

}

function markContactInvited(id){
  const c = (DB.contacts||[]).find(x=>x.id===id); if(!c) return;
  c.status = "invited"; c.invitedAt = new Date().toISOString();
  (async()=>{
    const {error}=await sb.from("contacts").update(mapContactToDB(c)).eq("id",c.id);

}

function toggleRecurringActive(id){

/* ---- Activity Log (admin only) ---- */
let AUDIT_LOG = [];
let AUDIT_LIMIT = 50;
let AUDIT_FILTER_TABLE = "";
let AUDIT_FILTER_ACTOR = "";

async function loadAuditLog(){
  if(!sb || !CURRENT_PROFILE || CURRENT_PROFILE.role !== "admin"){ AUDIT_LOG = []; return; }
  let q = sb.from("audit_log").select("*").order("occurred_at", { ascending:false }).limit(AUDIT_LIMIT);
  if(AUDIT_FILTER_TABLE) q = q.eq("table_name", AUDIT_FILTER_TABLE);
  if(AUDIT_FILTER_ACTOR) q = q.ilike("actor_email", "%"+AUDIT_FILTER_ACTOR+"%");
  const { data, error } = await q;
  if(error){ console.warn("audit log:", error); AUDIT_LOG = []; return; }
  AUDIT_LOG = data || [];
}

function fmtAuditTime(ts){
  if(!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleString(currentLang()==="fr"?"fr-FR":undefined, { dateStyle:"medium", timeStyle:"short" });
}
function fmtAuditAction(a){
  if(a==="INSERT") return `<span class="pill" style="background:#dcfce7;color:#166534">${t("audit_action_insert")}</span>`;
  if(a==="UPDATE") return `<span class="pill" style="background:#dbeafe;color:#1e40af">${t("audit_action_update")}</span>`;
  if(a==="DELETE") return `<span class="pill" style="background:#fee2e2;color:#991b1b">${t("audit_action_delete")}</span>`;
  return a;
}
function summarizeAuditRow(r){
  const after = r.after_data || {};
  const before = r.before_data || {};
  let label = r.table_name + " · " + (r.row_id||"");
  // For known tables, show friendlier label
  if(r.table_name === "members"){
    const f = after.first_name || before.first_name || "?";
    const l = after.last_name || before.last_name || "?";
    label = `Member: <b>${escape(f+' '+l)}</b>`;
  } else if(r.table_name === "payments"){
    const amt = after.amount || before.amount || 0;
    label = `Payment: <b>$${Number(amt).toFixed(2)}</b> (${after.type || before.type || "?"})`;
  } else if(r.table_name === "events"){
    label = `Event: <b>${escape(after.name || before.name || "?")}</b>`;
  } else if(r.table_name === "expenses"){
    const amt = after.amount || before.amount || 0;
    label = `Expense: <b>$${Number(amt).toFixed(2)}</b>`;
  } else if(r.table_name === "contacts"){
    const f = after.first_name || before.first_name || "?";
    const l = after.last_name || before.last_name || "?";
    label = `Contact: <b>${escape(f+' '+l)}</b>`;
  } else if(r.table_name === "settings"){
    label = `Settings updated`;
  } else if(r.table_name === "profiles"){
    label = `User profile: <b>${escape(after.email || before.email || after.display_name || "?")}</b>`;
  }
  if(r.action === "UPDATE" && r.changed_fields && r.changed_fields.length){
    label += ` <span style="color:var(--muted);font-size:11px">(${r.changed_fields.join(", ")})</span>`;
  }
  return label;
}

  if(!CURRENT_PROFILE || CURRENT_PROFILE.role !== "admin") return;

function showAuditDetails(r){
  const jsonBlock = data => {
    if(!data) return `<div style="color:var(--muted);font-style:italic">—</div>`;
    return `<pre style="background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;overflow:auto;max-height:200px">${escape(JSON.stringify(data, null, 2))}</pre>`;
  };
  const changed = (r.changed_fields||[]).length
    ? `<div style="margin-bottom:14px"><b>${t("audit_changes")}:</b> ${r.changed_fields.map(f=>`<span class="coverage-month-pill">${escape(f)}</span>`).join(" ")}</div>`

    ${changed}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><b>${t("audit_before")}</b>${jsonBlock(r.before_data)}</div>

    </div>
    <div class="modal-footer"><button class="btn btn-secondary" type="button" id="auditClose">${t("audit_close")}</button></div>

}

  const back = document.createElement("div");
  back.className = "modal-backdrop";
  back.innerHTML = `<div class="modal ${size==='lg'?'lg':''}">${html}</div>`;
  back.addEventListener("click", e=>{ if(e.target===back) back.remove(); });

}

function bindMemberStatusFields(modal, prefix){

  const notesWrap = modal.querySelector("#"+prefix+"_status_notes_wrap");
  const desc = modal.querySelector("#"+prefix+"_status_desc");
  function refresh(){
    const v = sel.value;

    notesWrap.style.display = show ? "" : "none";

      const dateInp = modal.querySelector("#"+prefix+"_status_date");
      if(dateInp && !dateInp.value) dateInp.value = todayISO();

}

            <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:normal;color:var(--text);margin:0"><input type="radio" name="ap_ctype" value="contact" style="width:auto;margin:0"> ${t("contributor_contact")}</label>
          </div>

      <div class="form-row" id="ap_contact_row" style="display:none">
        <div>
          <label>${t("contributor")} *</label>
          <select id="ap_contact">
            <option value="">${t("pick_existing")}…</option>
            ${contactOptions}
            <option value="__new__">+ ${t("add_new")} ${t("contact").toLowerCase()}…</option>
          </select>
        </div>
      </div>
      <div id="ap_new_contact" style="display:none;border:1px dashed var(--border);border-radius:8px;padding:12px;margin-bottom:14px;background:#fafbfc">
        <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">${t("new_contact_title")}</div>
        <div class="form-row cols-2" style="margin-bottom:8px">
          <div><label>${t("first_name")} *</label><input id="ap_nc_first"></div>
          <div><label>${t("last_name")} *</label><input id="ap_nc_last"></div>
        </div>
        <div class="form-row cols-2" style="margin-bottom:0">
          <div><label>${t("email")}</label><input id="ap_nc_email" type="email" placeholder="optional, for follow-up"></div>
          <div><label>${t("phone")}</label><input id="ap_nc_phone"></div>
        </div>
      </div>
      <div class="form-row cols-3">
        <div><label>${t("date")} *</label><input id="ap_date" type="date" required value="${todayISO()}"></div>
        <div><label>${t("amount")} ($) *</label><input id="ap_amount" type="number" min="0" step="0.01" required${event?` placeholder="min ${event.minAmount}"`:''}>${minNote}</div>
        <div><label>${t("type")} *</label><select id="ap_type">${typeOptions}</select></div>
      </div>
      <div id="ap_cover_block" ${event?'style="display:none"':''}>
        <div class="form-row" style="margin-bottom:6px"><div><label>${t("apply_to_months")}</label>
          <select id="ap_cover_mode">
            <option value="auto">${t("auto_apply")}</option>
            <option value="manual">${t("specific_months")}</option>
          </select>
        </div></div>
        <div id="ap_cover_manual" style="display:none">
          <div class="form-row cols-2">
            <div><label>${t("starting_month")} *</label><input id="ap_cover_start" type="month" value="${todayISO().slice(0,7)}"></div>
            <div><label>${t("num_months")} *</label><input id="ap_cover_count" type="number" min="1" step="1" value="1"></div>
          </div>
          <div style="font-size:11px;color:var(--muted);margin:-6px 0 14px">${t("will_apply_example")}</div>
          <div id="ap_cover_preview" style="font-size:12px;color:var(--brand);margin-bottom:14px"></div>
        </div>
      </div>
      ${!event ? `<div class="form-row"><div><label>${t("link_event")}</label><select id="ap_event">${eventOptions}</select></div></div>` : `<input type="hidden" id="ap_event" value="${event.id}">`}
      <div class="form-row"><div><label>${t("notes")}</label><textarea id="ap_notes" rows="2"></textarea></div></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" id="apCancel">${t("cancel")}</button>
        <button class="btn" type="submit">${t("save_payment")}</button>
      </div>
    </form>`);
  back.querySelector("#apCancel").addEventListener("click", ()=>closeModal(back));

  // Coverage UI toggling
  const typeSel = back.querySelector("#ap_type");
  const eventSel = back.querySelector("#ap_event");
  const coverBlock = back.querySelector("#ap_cover_block");
  const coverMode = back.querySelector("#ap_cover_mode");
  const coverManual = back.querySelector("#ap_cover_manual");
  const coverStart = back.querySelector("#ap_cover_start");
  const coverCount = back.querySelector("#ap_cover_count");
  const coverPreview = back.querySelector("#ap_cover_preview");
  const amountInp = back.querySelector("#ap_amount");
  const memberSel = back.querySelector("#ap_member");

  function updateCoverVisibility(){
    const t = typeSel ? typeSel.value : 'dues';
    const linked = eventSel ? eventSel.value : '';
    const show = (t==="dues") && !linked && !event;
    if(coverBlock) coverBlock.style.display = show ? "" : "none";
  }
  function updateCoverModeUI(){
    coverManual.style.display = coverMode.value==="manual" ? "" : "none";
    updateCoverPreview();
  }
  function autoComputeStart(){
    // Default: earliest unpaid billed month for the selected member, else current month
    const mid = memberSel.value;
    const m = DB.members.find(x=>x.id===mid);
    if(!m){ coverStart.value = todayISO().slice(0,7); return; }
    const alloc = buildMonthAllocations(m);
    const firstUnpaid = alloc.billedMonths.find(x=>!x.paid);
    if(firstUnpaid){ coverStart.value = firstUnpaid.ym; return; }
    // No unpaid billed months — default to month right after last prepaid month, or current
    if(alloc.prepaidThrough) coverStart.value = ymAdd(alloc.prepaidThrough, 1);
    else if(alloc.paidThrough) coverStart.value = ymAdd(alloc.paidThrough, 1);
    else coverStart.value = todayISO().slice(0,7);
  }
  function autoComputeCount(){
    const amt = parseFloat(amountInp.value)||0;
    const fee = DB.settings.monthlyFee;
    if(amt>0 && fee>0){
      coverCount.value = Math.max(1, Math.floor(amt/fee));
    }
  }
  function updateCoverPreview(){
    if(coverMode.value!=="manual"){ coverPreview.textContent=""; return; }
    const start = coverStart.value; const count = parseInt(coverCount.value,10)||0;
    if(!start || count<=0){ coverPreview.textContent=""; return; }
    const list = [];
    let ym = start;
    let i=0;
    while(list.length<count && i<count*2+12){
      if(!isExemptYM(ym, DB.settings.exemptYears)) list.push(ym);
      ym = ymAdd(ym,1); i++;
    }
    if(list.length===0){ coverPreview.textContent=""; return; }
    coverPreview.innerHTML = `<b>${t("will_apply_to")}</b> ${ymLabel(list[0])} → ${ymLabel(list[list.length-1])} (${list.length} ${t("months_lc")}, $${(list.length*DB.settings.monthlyFee).toFixed(2)})`;
  }

  typeSel.addEventListener("change", updateCoverVisibility);
  if(eventSel) eventSel.addEventListener("change", updateCoverVisibility);
  coverMode.addEventListener("change", ()=>{ if(coverMode.value==="manual"){ autoComputeStart(); autoComputeCount(); } updateCoverModeUI(); });
  coverStart.addEventListener("change", updateCoverPreview);
  coverCount.addEventListener("input", updateCoverPreview);
  amountInp.addEventListener("input", ()=>{ if(coverMode.value==="manual"){ autoComputeCount(); updateCoverPreview(); } });
  memberSel.addEventListener("change", ()=>{ if(coverMode.value==="manual"){ autoComputeStart(); updateCoverPreview(); } });
  updateCoverVisibility();
  updateCoverModeUI();

  /* Contributor type toggle (Member vs Non-member contact) */
  const ctypeRadios = back.querySelectorAll('input[name="ap_ctype"]');
  const memberRow = back.querySelector("#ap_member_row");
  const contactRow = back.querySelector("#ap_contact_row");
  const contactSel = back.querySelector("#ap_contact");
  const newContactBlock = back.querySelector("#ap_new_contact");
  function syncCtype(){
    const isContact = back.querySelector('input[name="ap_ctype"]:checked').value === "contact";
    memberRow.style.display = isContact ? "none" : "";
    contactRow.style.display = isContact ? "" : "none";
    memberSel.required = !isContact;
    if(isContact){
      typeSel.value = event ? eventPaymentType(event.type) : "special_contrib";
    }
    if(!isContact) newContactBlock.style.display = "none";
    updateCoverVisibility();
  }
  ctypeRadios.forEach(r => r.addEventListener("change", syncCtype));
  contactSel.addEventListener("change", ()=>{
    newContactBlock.style.display = contactSel.value === "__new__" ? "" : "none";
  });

  back.querySelector("#apForm").addEventListener("submit", e=>{
    e.preventDefault();
    const amount = parseFloat(amountInp.value)||0;
    const eid = eventSel.value || null;
    const ev = eid ? DB.events.find(x=>x.id===eid) : null;
    if(ev && amount < Number(ev.minAmount||0)){
      if(!confirm(t("confirm_below_min",{amount:fmtMoney(amount), min:fmtMoney(ev.minAmount)}))) return;
    }
    let type = typeSel.value;
    if(ev) type = eventPaymentType(ev.type);

    // Build appliesTo if dues + manual coverage
    let appliesTo = null;
    if(type==="dues" && !ev && coverMode.value==="manual"){
      const start = coverStart.value; const count = parseInt(coverCount.value,10)||0;
      if(start && count>0){
        const arr = []; let ym = start; let i=0;
        while(arr.length<count && i<count*2+12){
          if(!isExemptYM(ym, DB.settings.exemptYears)) arr.push(ym);
          ym = ymAdd(ym,1); i++;
        }
        appliesTo = arr;
      }
    }

    const isContact = back.querySelector('input[name="ap_ctype"]:checked').value === "contact";
    (async()=>{
      let memberId = null, contactId = null;
      if(isContact){
        let cid = contactSel.value;
        if(!cid){ toast("Pick a contact or add a new one.","err"); return; }
        if(cid === "__new__"){
          const f = back.querySelector("#ap_nc_first").value.trim();
          const l = back.querySelector("#ap_nc_last").value.trim();
          if(!f || !l){ toast("Enter first and last name for the new contact.","err"); return; }
          const newC = {
            id: uid("c"),
            firstName: titleCase(f), lastName: titleCase(l),
            email: back.querySelector("#ap_nc_email").value.trim() || null,
            phone: formatPhone(back.querySelector("#ap_nc_phone").value.trim()) || null,
            status: "prospect",
            source: ev ? ev.name : "Recorded payment "+todayISO()
          };
          const { error: ce } = await sb.from("contacts").insert(mapContactToDB(newC));
          if(ce){ toast("Contact: "+ce.message,"err"); return; }
          contactId = newC.id;
        } else {
          contactId = cid;
        }
      } else {
        memberId = memberSel.value;
      }
      const p = {
        id: uid("p"),
        memberId, contactId,
        date: back.querySelector("#ap_date").value,
        amount, type, eventId: eid,
        notes: back.querySelector("#ap_notes").value.trim()
      };
      if(appliesTo && appliesTo.length) p.appliesTo = appliesTo;
      const {error}=await sb.from("payments").insert(mapPaymentToDBv2(p));
      if(error){ toast(error.message,"err"); return; }
      toast(t("payment_recorded"),"ok"); closeModal(back);
      await loadAllFromSupabase();
      if(ev){ render(); setTimeout(()=>openEventView(ev.id),100); } else render();
    })();
  });
}
