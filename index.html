      <div class="form-row"><div><label>${t("description")}</label><textarea id="ne_desc" rows="2"></textarea></div></div>
      <div style="padding:14px;background:var(--soft);border-radius:8px;border:1px solid var(--border);margin-bottom:14px">
        <div style="margin-bottom:8px"><label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--brand)"><input type="checkbox" id="ne_raffle" style="width:auto;margin:0"> 🎟️ ${t("raffle_enabled")}</label></div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${t("raffle_help")}</div>
        <div id="ne_raffle_fields" style="display:none">
          <div class="form-row" style="margin-bottom:0"><div><label>${t("ticket_price")} *</label><input id="ne_tprice" type="number" min="0" step="0.01" value="5"></div></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" id="neCancel">${t("cancel")}</button>
        <button class="btn" type="submit">${t("create_event")}</button>
      </div>
    </form>`);
  back.querySelector("#neCancel").addEventListener("click", ()=>closeModal(back));

  const typeSel = back.querySelector("#ne_type");
  const coupleChk = back.querySelector("#ne_couple");
  const coupleHint = back.querySelector("#ne_couple_hint");
  const bShareInp = back.querySelector("#ne_bshare");
  const aShareInp = back.querySelector("#ne_ashare");
  const benefBlock = back.querySelector("#ne_benef_block");
  const raffleChk = back.querySelector("#ne_raffle");
  const raffleFields = back.querySelector("#ne_raffle_fields");
  raffleChk.addEventListener("change", ()=>{ raffleFields.style.display = raffleChk.checked ? "" : "none"; });
  let benefIds = [];

  function syncSplit(){
    const typ = typeSel.value;
    const n = benefIds.length;
    if(n === 0){
      coupleChk.checked = false; coupleChk.disabled = true; coupleHint.textContent = t("couple_hint_none");
    } else if(n === 1){
      coupleChk.disabled = false; coupleHint.textContent = t("couple_hint_one");
    } else if(n === 2){
      coupleChk.disabled = false; coupleHint.textContent = t("couple_hint_two");
    } else {
      coupleChk.checked = false; coupleChk.disabled = true; coupleHint.textContent = t("couple_hint_multi");
    }
    const split = aicoStatutSplit(typ, coupleChk.checked);
    if(split){ bShareInp.value = Math.round(split.b*100); aShareInp.value = Math.round(split.a*100); }
    else { if(!bShareInp.value) bShareInp.value = 0; aShareInp.value = Math.max(0, 100 - (parseFloat(bShareInp.value)||0)); }
    const showBenef = (typ==="birth" || typ==="death" || typ==="special_contrib" || typ==="other");
    benefBlock.style.display = showBenef ? "" : "none";
  }
  const picker = bindBeneficiaryPicker(back, "ne", [], (ids)=>{ benefIds = ids; syncSplit(); });
  typeSel.addEventListener("change", syncSplit);
  coupleChk.addEventListener("change", syncSplit);
  bShareInp.addEventListener("input", ()=>{ aShareInp.value = Math.max(0, 100 - (parseFloat(bShareInp.value)||0)); });
  syncSplit();

  back.querySelector("#neForm").addEventListener("submit", e=>{
    e.preventDefault();
    const ids = picker.getIds();
    const ev = {
      id: uid("ev"),
      name: back.querySelector("#ne_name").value.trim(),
      date: back.querySelector("#ne_date").value,
      type: typeSel.value,
      minAmount: parseFloat(back.querySelector("#ne_min").value)||0,
      description: back.querySelector("#ne_desc").value.trim(),
      beneficiaryMemberIds: ids,
      beneficiaryMemberId: ids[0] || null,
      isCouple: coupleChk.checked,
      beneficiaryShare: parseFloat(bShareInp.value)||0,
      aicoShare: parseFloat(aShareInp.value)||0,
      raffleEnabled: raffleChk.checked,
      ticketPrice: raffleChk.checked ? (parseFloat(back.querySelector("#ne_tprice").value)||0) : null,
      winnerNotes: ""
    };
    (async()=>{ const {error}=await sb.from("events").insert(mapEventToDB(ev)); if(error){ toast(error.message,"err"); return; } toast(t("event_created"),"ok"); closeModal(back); await loadAllFromSupabase(); render(); setTimeout(()=>openEventView(ev.id),100); })();
  });
}

function openEventView(eventId){
  const ev = DB.events.find(e=>e.id===eventId); if(!ev) return;
  // Split payments: regular contributions vs raffle ticket sales
  const allEventPayments = DB.payments.filter(p=>p.eventId===eventId);
  const ticketSales = allEventPayments.filter(p=>p.ticketCount && p.ticketCount>0);
  const contribs = allEventPayments.filter(p=>!p.ticketCount).sort((a,b)=>b.date.localeCompare(a.date));
  const total = contribs.reduce((s,p)=>s+Number(p.amount||0),0);
  const ticketCount = ticketSales.reduce((s,p)=>s+Number(p.ticketCount||0),0);
  const ticketRevenue = ticketSales.reduce((s,p)=>s+Number(p.amount||0),0);
  const contributorIds = new Set(contribs.map(c=>c.memberId));
  const nonContribs = DB.members.filter(m=>!contributorIds.has(m.id));
  const rows = contribs.length===0
    ? `<div class="empty">${t("no_contribs")}</div>`
    : `<table>
        <thead><tr><th>${t("contributor")}</th><th>${t("date")}</th><th class="num">${t("amount")}</th><th>${t("notes")}</th><th></th></tr></thead>
        <tbody>${contribs.map(p=>{
          let nameHtml = "?";
          if(p.memberId){
            const m = DB.members.find(x=>x.id===p.memberId);
            nameHtml = `<b>${m?escape(m.firstName+' '+m.lastName):'?'}</b> <span class="pill pill-member" style="margin-left:4px">${t("contributor_member")}</span>`;
          } else if(p.contactId){
            const c = (DB.contacts||[]).find(x=>x.id===p.contactId);
            nameHtml = `<b>${c?escape(c.firstName+' '+c.lastName):'?'}</b> <span class="pill pill-other" style="margin-left:4px">${t("contributor_contact")}</span>`;
          }
          const below = Number(p.amount||0) < Number(ev.minAmount||0);
          return `<tr><td>${nameHtml}</td><td>${fmtDate(p.date)}</td><td class="num ${below?'neg':''}">${fmtMoney(p.amount)} ${below?'<span style="font-size:10px">'+t("below_min")+'</span>':''}</td><td>${escape(p.notes||'')}</td><td><button class="btn btn-sm btn-danger" data-pdel="${p.id}">${t("del")}</button></td></tr>`;
        }).join("")}</tbody>
        <tfoot><tr><td colspan="2">${t("total_raised").toUpperCase()}</td><td class="num">${fmtMoney(total)}</td><td colspan="2"></td></tr></tfoot>
      </table>`;
  const nonContribList = nonContribs.length===0 ? t("contributors_done") : t("havent_contributed",{n:nonContribs.length});

  // Beneficiary + split block (supports multiple beneficiaries)
  const benefIdsList = ev.beneficiaryMemberIds && ev.beneficiaryMemberIds.length
    ? ev.beneficiaryMemberIds
    : (ev.beneficiaryMemberId ? [ev.beneficiaryMemberId] : []);
  const benefs = benefIdsList.map(id => DB.members.find(m=>m.id===id)).filter(Boolean);
  const bSharePct = Number(ev.beneficiaryShare||0);
  const aSharePct = Number(ev.aicoShare||0);
  const benefAmt = total * (bSharePct/100);
  const aicoAmt = total * (aSharePct/100);
  const perBenefAmt = benefs.length ? benefAmt / benefs.length : 0;
  const benefListRows = benefs.map(b=>{
    const e = memberIsEligible(b);
    const pill = e.ok
      ? `<span class="pill" style="background:#dcfce7;color:#166534">${t("eligible")}</span>`
      : (e.reason==="balance_due"
          ? `<span class="pill" style="background:#fee2e2;color:#991b1b">${t("balance_due",{amount:fmtMoney(e.balance)})}</span>`
          : `<span class="pill" style="background:#fee2e2;color:#991b1b">${t("not_member")}</span>`);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#fff;border-radius:6px;margin-top:6px;font-size:13px">
      <div><b>${escape(b.firstName+' '+b.lastName)}</b> &nbsp;${pill}</div>
      ${benefs.length>1?`<div style="font-weight:700;color:var(--ok)">${fmtMoney(perBenefAmt)}</div>`:''}
    </div>`;
  }).join("");
  const splitBlock = (bSharePct||aSharePct) ? `
    <div class="card" style="background:var(--soft);margin-top:0;margin-bottom:14px">
      <h3 style="margin-bottom:10px">${t("split_summary")}</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;font-size:13px">
        <div><div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px">${t("total_raised_lbl")}</div><div style="font-size:18px;font-weight:700;color:var(--brand)">${fmtMoney(total)}</div></div>
        <div><div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px">${t("beneficiary_share")} (${bSharePct}%)</div><div style="font-size:18px;font-weight:700;color:var(--ok)">${fmtMoney(benefAmt)}</div>${benefs.length>1?`<div style="font-size:11px;color:var(--muted)">${benefs.length} beneficiaries · ${fmtMoney(perBenefAmt)} each</div>`:(benefs.length===1?`<div style="font-size:11px;color:var(--muted)">${escape(benefs[0].firstName+' '+benefs[0].lastName)}</div>`:'')}</div>
        <div><div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px">${t("aico_share")} (${aSharePct}%)</div><div style="font-size:18px;font-weight:700;color:var(--brand-2)">${fmtMoney(aicoAmt)}</div></div>
      </div>
      ${benefs.length?`<div style="margin-top:14px;padding-top:10px;border-top:1px dashed var(--border)"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:4px">${t("beneficiary")}${benefs.length>1?'s':''}${ev.isCouple&&benefs.length===1?' <span class="pill pill-other" style="font-size:9px;margin-left:6px">Couple</span>':''}</div>${benefListRows}</div>`:''}
    </div>` : "";

  // Raffle block (only if enabled)
  const raffleBlock = ev.raffleEnabled ? renderRaffleBlock(ev, ticketSales, ticketCount, ticketRevenue) : "";

  const back = openModal(`
    <h2>${escape(ev.name)}${ev.raffleEnabled?' <span style="font-size:18px">🎟️</span>':''}</h2>
    <p style="color:var(--muted);font-size:13px;margin:-12px 0 14px">
      <span class="pill pill-${ev.type}">${eventTypeLabel(ev.type)}</span>
      &nbsp;·&nbsp; ${fmtDate(ev.date)}
      &nbsp;·&nbsp; ${t("minimum")} <b>${fmtMoney(ev.minAmount)}</b>
      ${ev.raffleEnabled?` &nbsp;·&nbsp; ${t("ticket_price")} <b>${fmtMoney(ev.ticketPrice||0)}</b>`:''}
    </p>
    ${ev.description?`<div class="info-bar">${escape(ev.description)}</div>`:""}
    ${splitBlock}
    ${raffleBlock}
    <div class="row-flex"><div style="font-size:13px;color:var(--muted)">${nonContribList}</div>
      <div class="actions">
        <button class="btn btn-sm" id="logContrib">${t("log_contribution")}</button>
        ${ev.raffleEnabled?`<button class="btn btn-sm" id="sellTickets" style="background:#f0b400;color:#3b2c00">${t("sell_tickets")}</button>`:""}
        <button class="btn btn-sm btn-secondary" id="editEv">${t("edit_event")}</button>
      </div>
    </div>
    ${rows}
    <div class="modal-footer"><button class="btn btn-secondary" type="button" id="evClose">${t("cancel")}</button></div>`, "lg");
  back.querySelector("#evClose").addEventListener("click", ()=>closeModal(back));
  back.querySelector("#logContrib").addEventListener("click", ()=>{ closeModal(back); openAddPayment(null, ev.id); });
  back.querySelector("#editEv").addEventListener("click", ()=>{ closeModal(back); openEditEvent(ev.id); });
  const sellBtn = back.querySelector("#sellTickets");
  if(sellBtn) sellBtn.addEventListener("click", ()=>{ closeModal(back); openSellTickets(ev.id); });
  const winnerForm = back.querySelector("#raffleWinnerForm");
  if(winnerForm) winnerForm.addEventListener("submit", e=>{
    e.preventDefault();
    const text = back.querySelector("#raffle_winner_notes").value.trim();
    (async()=>{ const {error}=await sb.from("events").update({ winner_notes: text || null }).eq("id",ev.id); if(error){ toast(error.message,"err"); return; } toast(t("winner_saved"),"ok"); await loadAllFromSupabase(); render(); setTimeout(()=>openEventView(eventId),100); })();
  });
  back.querySelectorAll("[data-tdel]").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(!confirm("Delete this ticket sale?")) return;
      (async()=>{ const {error}=await sb.from("payments").delete().eq("id",b.dataset.tdel); if(error){ toast(error.message,"err"); return; } toast(t("payment_deleted"),"ok"); closeModal(back); await loadAllFromSupabase(); render(); setTimeout(()=>openEventView(eventId),100); })();
    });
  });
  back.querySelectorAll("[data-pdel]").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(!confirm(t("confirm_delete_contrib"))) return;
      (async()=>{ const {error}=await sb.from("payments").delete().eq("id",b.dataset.pdel); if(error){ toast(error.message,"err"); return; } toast(t("contrib_deleted"),"ok"); closeModal(back); await loadAllFromSupabase(); render(); setTimeout(()=>openEventView(eventId),100); })();
    });
  });
}

function renderRaffleBlock(ev, ticketSales, ticketCount, ticketRevenue){
  const salesRows = ticketSales.length===0
    ? `<div class="empty" style="background:#fff;border-radius:6px;padding:20px">${t("no_ticket_sales")}</div>`
    : `<table style="background:#fff;border-radius:6px;overflow:hidden">
        <thead><tr><th>${t("buyer")}</th><th>${t("date")}</th><th class="num">${t("sale_count")}</th><th class="num">${t("amount")}</th><th></th></tr></thead>
        <tbody>${ticketSales.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{
          let nameHtml = "?";
          if(p.memberId){ const m = DB.members.find(x=>x.id===p.memberId); nameHtml = `<b>${m?escape(m.firstName+' '+m.lastName):'?'}</b> <span class="pill pill-member" style="font-size:9px;margin-left:4px">${t("buyer_member")}</span>`; }
          else if(p.contactId){ const c = (DB.contacts||[]).find(x=>x.id===p.contactId); nameHtml = `<b>${c?escape(c.firstName+' '+c.lastName):'?'}</b> <span class="pill pill-other" style="font-size:9px;margin-left:4px">${t("buyer_contact")}</span>`; }
          else { nameHtml = `<b style="color:var(--muted);font-style:italic">${t("anonymous")}</b>${p.anonymousLabel?` <span style="font-size:11px;color:var(--muted)">— ${escape(p.anonymousLabel)}</span>`:''}`; }
          return `<tr><td>${nameHtml}</td><td>${fmtDate(p.date)}</td><td class="num">${p.ticketCount}</td><td class="num">${fmtMoney(p.amount)}</td><td><button class="btn btn-sm btn-danger" data-tdel="${p.id}">${t("del")}</button></td></tr>`;
        }).join("")}</tbody>
        <tfoot><tr><td>TOTAL</td><td></td><td class="num">${ticketCount}</td><td class="num">${fmtMoney(ticketRevenue)}</td><td></td></tr></tfoot>
      </table>`;
  return `<div class="card" style="background:linear-gradient(135deg,#fef3c7,#fffbea);border-color:#fcd34d;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <h3 style="margin:0;color:#92400e">🎟️ ${t("raffle_section")}</h3>
      <div style="display:flex;gap:20px;font-size:13px">
        <div><span style="color:var(--muted)">${t("ticket_price")}:</span> <b>${fmtMoney(ev.ticketPrice||0)}</b></div>
        <div><span style="color:var(--muted)">${t("tickets_sold")}:</span> <b>${ticketCount}</b></div>
        <div><span style="color:var(--muted)">${t("raffle_revenue")}:</span> <b style="color:var(--ok)">${fmtMoney(ticketRevenue)}</b></div>
      </div>
    </div>
    <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">${t("raffle_sales")}</div>
    ${salesRows}
    <form id="raffleWinnerForm" style="margin-top:14px;padding-top:14px;border-top:1px dashed #fcd34d">
      <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#92400e;margin-bottom:4px">🏆 ${t("winner_notes")}</label>
      <div style="display:flex;gap:8px"><input id="raffle_winner_notes" value="${escape(ev.winnerNotes||'')}" placeholder="Ticket #042 — John Smith (TV)" style="flex:1"><button class="btn btn-sm" type="submit">${t("save_winner_notes")}</button></div>
    </form>
  </div>`;
}

function openSellTickets(eventId){
  const ev = DB.events.find(e=>e.id===eventId); if(!ev || !ev.raffleEnabled) return;
  const price = Number(ev.ticketPrice||0);
  const memberOpts = DB.members.slice().sort((a,b)=>a.lastName.localeCompare(b.lastName))
    .map(m=>`<option value="${m.id}">${escape(m.lastName)}, ${escape(m.firstName)}</option>`).join("");
  const contactOpts = (DB.contacts||[]).slice().sort((a,b)=>a.lastName.localeCompare(b.lastName))
    .map(c=>`<option value="${c.id}">${escape(c.lastName)}, ${escape(c.firstName)}</option>`).join("");
  const back = openModal(`
    <h2>🎟️ ${t("sell_tickets_title")} — ${escape(ev.name)}</h2>
    <p style="font-size:13px;color:var(--muted);margin:-10px 0 14px">${t("ticket_price")}: <b>${fmtMoney(price)}</b></p>
    <form id="stForm">
      <div class="form-row">
        <div>
          <label>${t("buyer_type")}</label>
          <div style="display:flex;gap:14px;align-items:center;font-size:13px;flex-wrap:wrap">
            <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:normal;color:var(--text);margin:0"><input type="radio" name="st_btype" value="member" checked style="width:auto;margin:0"> ${t("buyer_member")}</label>
            <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:normal;color:var(--text);margin:0"><input type="radio" name="st_btype" value="contact" style="width:auto;margin:0"> ${t("buyer_contact")}</label>
            <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:normal;color:var(--text);margin:0"><input type="radio" name="st_btype" value="anonymous" style="width:auto;margin:0"> ${t("buyer_anonymous")}</label>
          </div>
        </div>
      </div>
      <div class="form-row" id="st_member_row"><div><label>${t("buyer")}</label><select id="st_member">${memberOpts}</select></div></div>
      <div class="form-row" id="st_contact_row" style="display:none"><div><label>${t("buyer")}</label><select id="st_contact"><option value="">${t("pick_existing")}…</option>${contactOpts}</select></div></div>
      <div class="form-row" id="st_anon_row" style="display:none"><div><label>${t("anonymous_label_field")}</label><input id="st_anon_label" placeholder="${t("anonymous_label_ph")}"></div></div>
      <div class="form-row cols-3">
        <div><label>${t("date")} *</label><input id="st_date" type="date" required value="${todayISO()}"></div>
        <div><label>${t("num_tickets")} *</label><input id="st_count" type="number" min="1" step="1" required value="1"></div>
        <div><label>${t("ticket_total")}</label><input id="st_total" readonly style="background:#f3f4f6;font-weight:700;color:var(--brand)" value="${fmtMoney(price)}"></div>
      </div>
      <div class="form-row"><div><label>${t("notes")}</label><textarea id="st_notes" rows="2"></textarea></div></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" id="stCancel">${t("cancel")}</button>
        <button class="btn" type="submit">${t("sell_tickets").replace('+ ','')}</button>
      </div>
    </form>`);
  back.querySelector("#stCancel").addEventListener("click", ()=>{ closeModal(back); openEventView(eventId); });

  const radios = back.querySelectorAll('input[name="st_btype"]');
  const mRow = back.querySelector("#st_member_row");
  const cRow = back.querySelector("#st_contact_row");
  const aRow = back.querySelector("#st_anon_row");
  function syncType(){
    const v = back.querySelector('input[name="st_btype"]:checked').value;
    mRow.style.display = v==="member" ? "" : "none";
    cRow.style.display = v==="contact" ? "" : "none";
    aRow.style.display = v==="anonymous" ? "" : "none";
  }
  radios.forEach(r=>r.addEventListener("change", syncType));
  const countInp = back.querySelector("#st_count");
  const totalInp = back.querySelector("#st_total");
  function syncTotal(){
    const n = Math.max(1, parseInt(countInp.value,10)||1);
    totalInp.value = fmtMoney(n * price);
  }
  countInp.addEventListener("input", syncTotal);

  back.querySelector("#stForm").addEventListener("submit", e=>{
    e.preventDefault();
    const btype = back.querySelector('input[name="st_btype"]:checked').value;
    const n = Math.max(1, parseInt(countInp.value,10)||1);
    const amount = n * price;
    const p = {
      id: uid("t"),
      memberId: null, contactId: null, anonymousLabel: null,
      date: back.querySelector("#st_date").value,
      amount, type: "gala", eventId: ev.id,
      ticketCount: n,
      notes: back.querySelector("#st_notes").value.trim()
    };
    if(btype==="member"){ p.memberId = back.querySelector("#st_member").value; }
    else if(btype==="contact"){
      p.contactId = back.querySelector("#st_contact").value;
      if(!p.contactId){ toast("Pick a contact or switch to Anonymous.","err"); return; }
    } else {
      p.anonymousLabel = back.querySelector("#st_anon_label").value.trim() || "Anonymous";
    }
    (async()=>{
      const {error}=await sb.from("payments").insert(mapPaymentToDBv2(p));
      if(error){ toast(error.message,"err"); return; }
      toast(t("ticket_sale_recorded"),"ok"); closeModal(back);
      await loadAllFromSupabase(); render(); setTimeout(()=>openEventView(eventId),100);
    })();
  });
}

function openEditEvent(id){
  const ev = DB.events.find(e=>e.id===id); if(!ev) return;
  const typeOpts = EVENT_TYPES.map(et=>`<option value="${et.value}" ${et.value===ev.type?'selected':''}>${eventTypeLabel(et.value)}</option>`).join("");
  const back = openModal(`
    <h2>${t("edit_event")}</h2>
    <div class="info-bar" style="background:#eef4f9;border-color:#bcdcee;color:#0d4a6b"><b>${t("statut_info_title")}</b><br>${t("statut_info_body")}</div>
    <form id="eeForm">
      <div class="form-row cols-2">
        <div><label>${t("event_name")} *</label><input id="ee_name" required value="${escape(ev.name)}"></div>
        <div><label>${t("date")} *</label><input id="ee_date" type="date" required value="${ev.date}"></div>
      </div>
      <div class="form-row cols-2">
        <div><label>${t("type")} *</label><select id="ee_type">${typeOpts}</select></div>
        <div><label>${t("min_contribution")} *</label><input id="ee_min" type="number" min="0" step="0.01" required value="${ev.minAmount}"></div>
      </div>
      <div id="ee_benef_block">
        <div class="form-row">${beneficiaryPickerHTML("ee", ev.beneficiaryMemberIds||[])}</div>
        <div class="form-row"><div><label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px"><input type="checkbox" id="ee_couple" ${ev.isCouple?'checked':''} style="width:auto;margin:0"> ${t("couple_event")}</label><div style="font-size:11px;color:var(--muted);margin-top:4px" id="ee_couple_hint"></div></div></div>
        <div class="form-row cols-2">
          <div><label>${t("beneficiary_share")} (%)</label><input id="ee_bshare" type="number" min="0" max="100" step="1" value="${ev.beneficiaryShare||0}"></div>
          <div><label>${t("aico_share")} (%)</label><input id="ee_ashare" type="number" min="0" max="100" step="1" readonly value="${ev.aicoShare||0}" style="background:#f3f4f6"></div>
        </div>
      </div>
      <div class="form-row"><div><label>${t("description")}</label><textarea id="ee_desc" rows="2">${escape(ev.description||'')}</textarea></div></div>
      <div style="padding:14px;background:var(--soft);border-radius:8px;border:1px solid var(--border);margin-bottom:14px">
        <div style="margin-bottom:8px"><label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--brand)"><input type="checkbox" id="ee_raffle" ${ev.raffleEnabled?'checked':''} style="width:auto;margin:0"> 🎟️ ${t("raffle_enabled")}</label></div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${t("raffle_help")}</div>
        <div id="ee_raffle_fields" style="display:${ev.raffleEnabled?'':'none'}">
          <div class="form-row" style="margin-bottom:0"><div><label>${t("ticket_price")} *</label><input id="ee_tprice" type="number" min="0" step="0.01" value="${ev.ticketPrice||5}"></div></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" id="eeCancel">${t("cancel")}</button>
        <button class="btn" type="submit">${t("save_changes")}</button>
      </div>
    </form>`);
  back.querySelector("#eeCancel").addEventListener("click", ()=>closeModal(back));

  const typeSel = back.querySelector("#ee_type");
  const coupleChk = back.querySelector("#ee_couple");
  const coupleHint = back.querySelector("#ee_couple_hint");
  const bShareInp = back.querySelector("#ee_bshare");
  const aShareInp = back.querySelector("#ee_ashare");
  const raffleChk = back.querySelector("#ee_raffle");
  const raffleFields = back.querySelector("#ee_raffle_fields");
  raffleChk.addEventListener("change", ()=>{ raffleFields.style.display = raffleChk.checked ? "" : "none"; });
  let benefIds = (ev.beneficiaryMemberIds||[]).slice();
  function syncSplit(){
    const typ = typeSel.value;
    const n = benefIds.length;
    if(n === 0){
      coupleChk.checked = false; coupleChk.disabled = true; coupleHint.textContent = t("couple_hint_none");
    } else if(n === 1){
      coupleChk.disabled = false; coupleHint.textContent = t("couple_hint_one");
    } else if(n === 2){
      coupleChk.disabled = false; coupleHint.textContent = t("couple_hint_two");
    } else {
      coupleChk.checked = false; coupleChk.disabled = true; coupleHint.textContent = t("couple_hint_multi");
    }
    const split = aicoStatutSplit(typ, coupleChk.checked);
    if(split){ bShareInp.value = Math.round(split.b*100); aShareInp.value = Math.round(split.a*100); }
    else { aShareInp.value = Math.max(0, 100 - (parseFloat(bShareInp.value)||0)); }
  }
  const picker = bindBeneficiaryPicker(back, "ee", ev.beneficiaryMemberIds||[], (ids)=>{ benefIds = ids; syncSplit(); });
  typeSel.addEventListener("change", syncSplit);
  coupleChk.addEventListener("change", syncSplit);
  bShareInp.addEventListener("input", ()=>{ aShareInp.value = Math.max(0, 100 - (parseFloat(bShareInp.value)||0)); });
  syncSplit();

  back.querySelector("#eeForm").addEventListener("submit", e=>{
    e.preventDefault();
    const ids = picker.getIds();
    ev.name = back.querySelector("#ee_name").value.trim();
    ev.date = back.querySelector("#ee_date").value;
    ev.type = typeSel.value;
    ev.minAmount = parseFloat(back.querySelector("#ee_min").value)||0;
    ev.description = back.querySelector("#ee_desc").value.trim();
    ev.beneficiaryMemberIds = ids;
    ev.beneficiaryMemberId = ids[0] || null;
    ev.isCouple = coupleChk.checked;
    ev.beneficiaryShare = parseFloat(bShareInp.value)||0;
    ev.aicoShare = parseFloat(aShareInp.value)||0;
    ev.raffleEnabled = raffleChk.checked;
    ev.ticketPrice = raffleChk.checked ? (parseFloat(back.querySelector("#ee_tprice").value)||0) : null;
    (async()=>{ const {error}=await sb.from("events").update(mapEventToDB(ev)).eq("id",ev.id); if(error){ toast(error.message,"err"); return; } toast(t("event_updated"),"ok"); closeModal(back); await loadAllFromSupabase(); render(); })();
  });
}

function deleteEvent(id){
  const ev = DB.events.find(e=>e.id===id); if(!ev) return;
  const contribs = contributionsForEvent(id);
  const msg = contribs.length
    ? t("confirm_delete_event",{name:ev.name, n:contribs.length})
    : t("confirm_delete_event_simple",{name:ev.name});
  if(!confirm(msg)) return;
  (async()=>{ const {error}=await sb.from("events").delete().eq("id",id); if(error){ toast(error.message,"err"); return; } toast(t("event_deleted"),"ok"); await loadAllFromSupabase(); render(); })();
}

/* --- Users --- */
function openAddUser(){
  const memberOpts = `<option value="">${t("none_opt")}</option>` + DB.members.slice().sort((a,b)=>a.lastName.localeCompare(b.lastName))
    .map(m=>`<option value="${m.id}">${escape(m.lastName)}, ${escape(m.firstName)}</option>`).join("");
  const back = openModal(`
    <h2>${t("add_user_title")}</h2>
    <form id="auForm">
      <div class="form-row cols-2">
        <div><label>${t("username")} *</label><input id="au_user" required></div>
        <div><label>${t("display_name")}</label><input id="au_name"></div>
      </div>
      <div class="form-row cols-2">
        <div><label>${t("password")} *</label><input id="au_pass" required></div>
        <div><label>${t("role")} *</label>
          <select id="au_role">
            <option value="member">${t("member_role")}</option>
            <option value="finance">${t("finance_role")}</option>
            <option value="admin">${t("admin_role")}</option>
          </select>
        </div>
      </div>
      <div class="form-row"><div><label>${t("link_member_opt")}</label><select id="au_member">${memberOpts}</select></div></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" id="auCancel">${t("cancel")}</button>
        <button class="btn" type="submit">${t("create_user")}</button>
      </div>
    </form>`);
  back.querySelector("#auCancel").addEventListener("click", ()=>closeModal(back));
  back.querySelector("#auForm").addEventListener("submit", e=>{
    e.preventDefault();
    const uname = back.querySelector("#au_user").value.trim();
    const password = back.querySelector("#au_pass").value;
    if(DB.users.some(u=>u.username.toLowerCase()===uname.toLowerCase())){ toast(t("username_exists"),"err"); return; }
    (async()=>{
      const { data, error } = await sb.auth.signUp({ email: uname, password });
      if(error){ toast(error.message,"err"); return; }
      const role = back.querySelector("#au_role").value;
      const memberId = back.querySelector("#au_member").value || null;
      const displayName = back.querySelector("#au_name").value.trim() || uname;
      // Give the signup trigger a moment to insert the profile row, then update.
      setTimeout(async ()=>{
        if(data && data.user && data.user.id){
          await sb.from("profiles").update({ role, member_id: memberId, display_name: displayName }).eq("id", data.user.id);
        }
        toast(t("user_created") + " — they must confirm their email to log in.","ok");
        closeModal(back); await loadAllFromSupabase(); render();
      }, 700);
    })();
  });
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "aico-portal-backup-" + todayISO() + ".json"; a.click();
  URL.revokeObjectURL(url);
  toast(t("backup_downloaded"),"ok");
}

function exportMembersCSV(){
  const header = ["FirstName","LastName","Street","City","State","Zip","Email","Phone","JoinDate","MonthlyStartDate","Status","StatusDate","Billed","Paid","Balance","PaidThrough","PrepaidThrough"];
  const lines = [header.join(",")];
  DB.members.forEach(m=>{
    const d = calcMemberDues(m);
    const cell = s => `"${String(s||'').replace(/"/g,'""')}"`;
    lines.push([
      cell(m.firstName), cell(m.lastName),
      cell(titleCase(m.address||'')), cell(titleCase(m.city||'')),
      cell(normState(m.state||'')), cell(m.zip||''),
      cell(m.email||''), cell(formatPhone(m.phone||'')),
      m.joinDate, m.monthlyStartDate, cell(m.status||"active"), cell(m.statusDate||""),
      d.total, d.paid, d.balance,
      d.alloc.paidThrough||"", d.alloc.prepaidThrough||""
    ].join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `aico-members-${todayISO()}.csv`;
  a.click();
  toast(t("members_csv_downloaded"),"ok");
}
